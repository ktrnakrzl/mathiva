[pytest]
# Run pytest from the backend/ directory. `pythonpath = .` makes the `app`
# package importable without installing it. We deliberately do NOT import
# app.main in tests -- it pulls in the pix2tex OCR model and the
# sentence-transformers/FAISS RAG stack at import time (slow, needs weights).
# The suite mounts only the auth + quiz routers instead (see conftest.py), so
# it stays fast and hermetic.
pythonpath = .
testpaths = tests
addopts = -q
