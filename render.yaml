services:
  - type: web
    name: mathiva-api
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mathiva-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://mathiva-web.onrender.com
      - key: CORS_ORIGINS
        value: "*"
      - key: DISABLE_T5
        value: "true"
      - key: DISABLE_OLLAMA
        value: "true"
      - key: DISABLE_PIX2TEX
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"

  - type: web
    name: mathiva-web
    runtime: static
    buildCommand: bash scripts/render_build_frontend.sh
    staticPublishPath: frontend/build/web
    autoDeployTrigger: commit
    envVars:
      - key: API_BASE_URL
        value: https://mathiva-api.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FLUTTER_VERSION
        value: stable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: mathiva-db
    plan: basic-256mb
    databaseName: mathiva
    user: mathiva
