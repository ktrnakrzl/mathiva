name: CI

# CI: run backend/frontend checks, audit dependency changes, and prove the
# Docker image builds on every push and PR. CD: publish the backend image to
# GHCR on pushes to main.
on:
  push:
    branches: [main, theme-v2]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests, audit, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile's runtime (python:3.12-slim) so CI validates the
          # deployment target, not just the 3.14 dev machine.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch + torchvision first (as the Dockerfile does); the
          # default PyPI wheels bundle ~2 GB of CUDA a test run never uses. The
          # --extra-index-url keeps the requirements resolve on CPU wheels too.
          pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          # Test-only deps (pytest, httpx) live in a separate file so they stay
          # out of the runtime image; install them for the test run.
          pip install -r backend/requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          # Baseline the vulnerabilities already present in the pinned ML/image
          # stack so new/unreviewed advisories still fail CI. Remove these
          # ignores as the pins are upgraded.
          pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt --strict \
            --ignore-vuln GHSA-xrqw-3rrv-vx5w \
            --ignore-vuln PYSEC-2026-2253 \
            --ignore-vuln PYSEC-2026-2255 \
            --ignore-vuln PYSEC-2026-2257 \
            --ignore-vuln PYSEC-2026-2256 \
            --ignore-vuln PYSEC-2026-2254 \
            --ignore-vuln PYSEC-2026-3453 \
            --ignore-vuln PYSEC-2026-3451 \
            --ignore-vuln PYSEC-2026-3452 \
            --ignore-vuln PYSEC-2026-3454 \
            --ignore-vuln PYSEC-2026-3495 \
            --ignore-vuln PYSEC-2026-3496 \
            --ignore-vuln PYSEC-2026-3494 \
            --ignore-vuln PYSEC-2026-3493 \
            --ignore-vuln GHSA-rrmf-rvhw-rf47 \
            --ignore-vuln PYSEC-2026-3447

      - name: Run pytest
        working-directory: backend
        env:
          DISABLE_PIX2TEX: "false"
        run: pytest

      - name: Production app smoke test
        working-directory: backend
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/mathiva
          JWT_SECRET: ci-production-smoke-secret-32-plus-bytes
          DISABLE_T5: "true"
          DISABLE_OLLAMA: "true"
          DISABLE_PIX2TEX: "true"
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: https://app.example.com
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200
              assert response.json() == {"status": "ok"}
          PY

  flutter-checks:
    name: Flutter analyze & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        # The codebase carries ~79 known SDK deprecation *infos* (e.g.
        # Color.withOpacity). --no-fatal-infos/--no-fatal-warnings make this gate
        # fail only on real *errors* (undefined names, type mismatches) in the
        # untested Dart layer, not on that pre-existing deprecation debt.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run widget tests
        working-directory: frontend
        run: flutter test

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  docker:
    name: Build & publish backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Publish only on a real push to main; PRs and other branches just build.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
