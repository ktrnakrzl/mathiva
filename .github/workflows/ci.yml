name: CI

# CI: run the backend test suite and prove the Docker image builds on every push
# and PR. CD: publish the backend image to GHCR on pushes to main.
on:
  push:
    branches: [main, theme-v2]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile's runtime (python:3.12-slim) so CI validates the
          # deployment target, not just the 3.14 dev machine.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch + torchvision first (as the Dockerfile does); the
          # default PyPI wheels bundle ~2 GB of CUDA a test run never uses. The
          # --extra-index-url keeps the requirements resolve on CPU wheels too.
          pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          # Test-only deps (pytest, httpx) live in a separate file so they stay
          # out of the runtime image; install them for the test run.
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        working-directory: backend
        run: pytest

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve packages
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        # The codebase carries ~79 known SDK deprecation *infos* (e.g.
        # Color.withOpacity). --no-fatal-infos/--no-fatal-warnings make this gate
        # fail only on real *errors* (undefined names, type mismatches) in the
        # untested Dart layer, not on that pre-existing deprecation debt.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  docker:
    name: Build & publish backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Publish only on a real push to main; PRs and other branches just build.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
